[project]
name = "slot-tracker"
version = "0.3.3"
description = "Self-hosted slot bonus, hunt, and session tracker."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# Runtime dependencies — these ship in the image (`uv sync --no-dev`). Alembic is
# included because docker-entrypoint.sh invokes it. Keep this list to what the
# running app actually imports; the development-only importer's dependency lives
# in the dev group.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "jinja2>=3.1",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
]

[dependency-groups]
# Dev-only. Excluded from the production image via `uv sync --no-dev`.
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    # Read by the .ods importer only, which is not shipped in the image.
    # pandas was declared here historically but is unused — reader.py walks the
    # workbook with odfpy directly, so pandas (and numpy) were dead weight.
    "odfpy>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
