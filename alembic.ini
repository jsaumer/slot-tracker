# Alembic configuration. The database URL is NOT set here — env.py reads
# DATABASE_URL from the environment (CLAUDE.md constraint 4). Do not add a
# sqlalchemy.url line; it would be a baked config value.

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration filenames: 0001_slug, 0002_slug, ... kept sortable and human-legible.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
